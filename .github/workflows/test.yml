name: Build and test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockflow_test
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum
      - name: Backend integration and race tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://stockflow:stockflow_test@localhost:5432/stockflow_test?sslmode=disable
        run: |
          go test -race -count=1 -v ./...
          go vet ./...
          go build ./cmd/server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build and tests
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
