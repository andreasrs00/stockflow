services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://stockflow:stockflow_local@db:5432/stockflow?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgres://stockflow:stockflow_local@db:5432/stockflow?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test
volumes:
  pgdata:
